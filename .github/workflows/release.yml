name: Release

# Ships a notarized, Rust-only Hopper. The version lives in the workspace
# Cargo.toml (not package.json — that is the retired Bun build); pushing a bump
# to main tags and releases.
#
# There is no `hopperd` Swift sidecar: the VM is created in-process, so the app
# itself carries com.apple.security.virtualization and there is no inside-out
# signing dance.

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Read workspace version
        id: version
        run: |
          V=$(sed -n 's/^version = "\([0-9][^"]*\)".*/\1/p' Cargo.toml | head -1)
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # Release when the version has no matching tag yet — idempotent across
      # both push and manual dispatch.
      - name: Decide whether to release
        id: diff
        run: |
          V="${{ steps.version.outputs.version }}"
          if git ls-remote --tags origin "refs/tags/v${V}" | grep -q .; then
            echo "v${V} already released — skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # The correctness gate the Bun workflow never had: nothing ships unless the
  # tests, clippy, and a release build all pass first.
  verify:
    runs-on: macos-14
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Release build
        run: cargo build --workspace --release

  create-release:
    runs-on: ubuntu-latest
    needs: [check-version, verify]
    if: needs.check-version.outputs.changed == 'true'
    steps:
      - uses: actions/checkout@v5
      - name: Tag
        run: |
          git tag "v${{ needs.check-version.outputs.version }}"
          git push origin "v${{ needs.check-version.outputs.version }}"
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.check-version.outputs.version }}"
          generate_release_notes: true
          draft: false

  # The guest engine image: a raw arm64 kernel plus the rootfs initramfs. Built
  # on Linux where cross-compilation and buildx are cheap, then handed to the
  # macOS bundling job. Output goes to native/build/guest (the retired sidecar's
  # .build tree is gone).
  guest:
    runs-on: ubuntu-latest
    needs: [check-version, verify]
    if: needs.check-version.outputs.changed == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Cache guest kernel
        id: kcache
        uses: actions/cache@v4
        with:
          path: native/build/guest/vmlinuz
          key: hopper-kernel-6.12.8-${{ hashFiles('native/guest/kernel.config') }}

      - name: Install kernel build deps
        if: steps.kcache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu bc bison flex libssl-dev libelf-dev cpio xz-utils

      - name: Build aarch64 kernel
        if: steps.kcache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ver="6.12.8"
          series="v${ver%%.*}.x"
          curl -fsSL "https://cdn.kernel.org/pub/linux/kernel/${series}/linux-${ver}.tar.xz" | tar -xJ
          cd "linux-${ver}"
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          make defconfig
          ./scripts/kconfig/merge_config.sh -m .config "$GITHUB_WORKSPACE/native/guest/kernel.config"
          # Force the bridge stack built-in (IPV6=m would otherwise cap BRIDGE
          # at =m, and an initramfs-only guest has no modules).
          scripts/config -e IPV6 -e BRIDGE -e BRIDGE_NETFILTER -e LLC -e STP -e VLAN_8021Q
          make olddefconfig
          grep -q '^CONFIG_BRIDGE=y' .config || { echo 'FATAL: CONFIG_BRIDGE not built-in'; exit 1; }
          make -j"$(nproc)" Image
          mkdir -p "$GITHUB_WORKSPACE/native/build/guest"
          # A raw arm64 Image — Virtualization.framework will not accept a
          # gzipped vmlinuz.
          cp arch/arm64/boot/Image "$GITHUB_WORKSPACE/native/build/guest/vmlinuz"

      - name: Set up QEMU (cross-arch rootfs build)
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build guest rootfs -> initrd
        run: |
          set -euo pipefail
          out="native/build/guest"
          mkdir -p "$out"
          docker buildx build --load \
            --platform linux/arm64 \
            --build-arg "DOCKER_ARCH=aarch64" \
            -f native/guest/dockerfile \
            -t hopper-guest native/guest
          cid="$(docker create --platform linux/arm64 hopper-guest)"
          tmp="$(mktemp -d)"
          docker export "$cid" | tar -x -C "$tmp"
          docker rm -f "$cid"
          ( cd "$tmp" && find . -xdev | cpio -o -H newc 2>/dev/null | gzip -9 ) > "$out/initrd"
          ls -la "$out"

      - name: Upload guest assets
        uses: actions/upload-artifact@v4
        with:
          name: guest
          path: |
            native/build/guest/vmlinuz
            native/build/guest/initrd

  build:
    needs: [check-version, verify, create-release, guest]
    if: needs.check-version.outputs.changed == 'true'
    runs-on: macos-14
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: "v${{ needs.check-version.outputs.version }}"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Download guest assets
        uses: actions/download-artifact@v4
        with:
          name: guest
          path: native/build/guest

      - name: Fetch Compose + Docker CLI (host binaries)
        run: |
          set -euo pipefail
          scripts/build/compose.sh
          # The Docker CLI is Apache-2.0; shipping it is what lets a user
          # uninstall Docker Desktop and keep a working `docker` command.
          ver="27.5.1"
          curl -fsSL "https://download.docker.com/mac/static/stable/aarch64/docker-${ver}.tgz" \
            | tar -xz -C /tmp
          mkdir -p native/build
          cp /tmp/docker/docker native/build/docker

      - name: Import signing certificate
        if: env.APPLE_SIGNING_IDENTITY != ''
        env:
          CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          rm -f "$RUNNER_TEMP/cert.p12"

      # bundle.sh builds the release binary, assembles Hopper.app, stages the
      # guest assets into Resources, and signs the app itself with the
      # virtualization entitlement.
      - name: Bundle (.app) + package (.dmg)
        env:
          CODESIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          scripts/bundle.sh
          scripts/dmg.sh

      - name: Notarize
        if: env.APPLE_ID != ''
        run: |
          xcrun notarytool submit dist/Hopper.dmg \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dist/Hopper.dmg

      - name: Verify engine bundle
        run: |
          set -euo pipefail
          app="dist/Hopper.app/Contents"
          codesign --verify --strict --verbose=2 dist/Hopper.app
          test -x "$app/MacOS/hopper" || { echo "FATAL: app binary missing"; exit 1; }
          test -f "$app/Resources/vmlinuz" || { echo "FATAL: guest kernel not in Resources"; exit 1; }
          test -f "$app/Resources/initrd" || { echo "FATAL: guest initrd not in Resources"; exit 1; }
          if file "$app/Resources/vmlinuz" | grep -qi gzip; then
            echo "FATAL: vmlinuz is gzip-compressed; VZ needs a raw arm64 Image"; exit 1
          fi
          # The whole point of the Rust port: the entitlement is on the app
          # itself, not a separate sidecar.
          if codesign -d --entitlements - "$app/MacOS/hopper" 2>/dev/null | grep -q virtualization; then
            echo "OK: the app carries com.apple.security.virtualization"
          else
            echo "FATAL: the app is missing the virtualization entitlement — the VM cannot start"
            exit 1
          fi
          if [ -z "${APPLE_SIGNING_IDENTITY}" ]; then
            echo "::warning::Ad-hoc build — the VM engine will not boot without a Developer ID."
          fi

      - name: Upload DMG
        run: gh release upload "v${{ needs.check-version.outputs.version }}" dist/Hopper.dmg --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  update-homebrew:
    runs-on: ubuntu-latest
    needs: [check-version, build]
    if: needs.check-version.outputs.changed == 'true'
    steps:
      - name: Download DMG and compute SHA
        id: shas
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          URL="https://github.com/wess/hopper/releases/download/v${VERSION}/Hopper.dmg"
          for i in $(seq 1 30); do
            if curl -fsSL -o /tmp/Hopper.dmg "${URL}" 2>/dev/null; then
              break
            fi
            echo "Waiting for Hopper.dmg... ($i/30)"
            sleep 10
          done
          SHA=$(sha256sum /tmp/Hopper.dmg | cut -d' ' -f1)
          echo "sha_darwin_arm64=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew tap
        uses: actions/checkout@v5
        with:
          repository: wess/homebrew-packages
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update cask
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          mkdir -p tap/Casks
          cat > tap/Casks/hopper.rb << 'RUBY'
          cask "hopper" do
            version "VERSION_PLACEHOLDER"
            sha256 "SHA_DARWIN_ARM64_PLACEHOLDER"

            url "https://github.com/wess/hopper/releases/download/v#{version}/Hopper.dmg"
            name "Hopper"
            desc "Native Docker engine and manager — runs Docker in its own VM, no Docker Desktop"
            homepage "https://github.com/wess/hopper"

            depends_on arch: :arm64
            depends_on macos: :sonoma

            app "Hopper.app"

            zap trash: [
              "~/Library/Application Support/Hopper",
              "~/Library/Preferences/io.wess.hopper.plist",
              "~/.hopper",
            ]
          end
          RUBY
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" tap/Casks/hopper.rb
          sed -i "s/SHA_DARWIN_ARM64_PLACEHOLDER/${{ steps.shas.outputs.sha_darwin_arm64 }}/g" tap/Casks/hopper.rb

      - name: Push updated cask
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/hopper.rb
          if git diff --cached --quiet; then
            echo "Cask unchanged — skipping push."
          else
            git commit -m "Update hopper to v${{ needs.check-version.outputs.version }}"
            git push
          fi
