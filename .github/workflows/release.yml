name: Release

# Ships a notarized, Rust-only Hopper. The version lives in the workspace
# Cargo.toml (not package.json — that is the retired Bun build); pushing a bump
# to main tags and releases.
#
# Hopper ships no engine of its own any more. On macOS the engine is Apple's
# `container`, which the user installs and which does its own virtualization,
# so there is no guest kernel to compile here and no entitlement to sign in.

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Read workspace version
        id: version
        run: |
          V=$(sed -n 's/^version = "\([0-9][^"]*\)".*/\1/p' Cargo.toml | head -1)
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # Release when the version has no matching tag yet — idempotent across
      # both push and manual dispatch.
      - name: Decide whether to release
        id: diff
        run: |
          V="${{ steps.version.outputs.version }}"
          if git ls-remote --tags origin "refs/tags/v${V}" | grep -q .; then
            echo "v${V} already released — skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # The correctness gate the Bun workflow never had: nothing ships unless the
  # tests, clippy, and a release build all pass first.
  verify:
    runs-on: macos-14
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Release build
        run: cargo build --workspace --release

  create-release:
    runs-on: ubuntu-latest
    needs: [check-version, verify]
    if: needs.check-version.outputs.changed == 'true'
    steps:
      - uses: actions/checkout@v5
      - name: Tag
        run: |
          git tag "v${{ needs.check-version.outputs.version }}"
          git push origin "v${{ needs.check-version.outputs.version }}"
      - name: GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.check-version.outputs.version }}"
          generate_release_notes: true
          # Draft until the signed DMG is uploaded — a published release with
          # no assets is worse than none (the Homebrew cask 404s on it).
          draft: true

  build:
    needs: [check-version, verify, create-release]
    if: needs.check-version.outputs.changed == 'true'
    runs-on: macos-14
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: "v${{ needs.check-version.outputs.version }}"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Fetch Compose + Docker CLI (host binaries)
        run: |
          set -euo pipefail
          scripts/build/compose.sh
          # The Docker CLI is Apache-2.0; shipping it is what lets a user
          # uninstall Docker Desktop and keep a working `docker` command.
          ver="27.5.1"
          curl -fsSL "https://download.docker.com/mac/static/stable/aarch64/docker-${ver}.tgz" \
            | tar -xz -C /tmp
          mkdir -p native/build
          cp /tmp/docker/docker native/build/docker

      - name: Import signing certificate
        if: env.APPLE_SIGNING_IDENTITY != ''
        env:
          CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          rm -f "$RUNNER_TEMP/cert.p12"

      # bundle.sh builds the release binary, assembles Hopper.app, stages the
      # bundled Docker CLI and Compose, and signs the app.
      - name: Bundle (.app) + package (.dmg)
        env:
          CODESIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          scripts/bundle.sh
          scripts/dmg.sh

      - name: Notarize
        if: env.APPLE_ID != ''
        run: |
          xcrun notarytool submit dist/Hopper.dmg \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dist/Hopper.dmg

      - name: Verify bundle
        run: |
          set -euo pipefail
          app="dist/Hopper.app/Contents"
          codesign --verify --strict --verbose=2 dist/Hopper.app
          test -x "$app/MacOS/hopper" || { echo "FATAL: app binary missing"; exit 1; }
          # Hopper no longer ships a VM, so it no longer asks for the
          # entitlement that used to gate it. Carrying it would widen the
          # sandbox for nothing, so assert it is *absent*.
          if codesign -d --entitlements - "$app/MacOS/hopper" 2>/dev/null | grep -q virtualization; then
            echo "FATAL: the virtualization entitlement is back; Apple's runtime does its own"
            exit 1
          fi
          echo "OK: signed, and asking for no virtualization entitlement"

      - name: Upload DMG
        run: gh release upload "v${{ needs.check-version.outputs.version }}" dist/Hopper.dmg --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    runs-on: ubuntu-latest
    needs: [check-version, build]
    if: needs.check-version.outputs.changed == 'true'
    steps:
      - uses: actions/checkout@v5
      # Flip the draft live only once the DMG is attached.
      - name: Publish the release
        run: gh release edit "v${{ needs.check-version.outputs.version }}" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}

  update-homebrew:
    runs-on: ubuntu-latest
    needs: [check-version, publish]
    if: needs.check-version.outputs.changed == 'true'
    steps:
      - name: Download DMG and compute SHA
        id: shas
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          URL="https://github.com/wess/hopper/releases/download/v${VERSION}/Hopper.dmg"
          for i in $(seq 1 30); do
            if curl -fsSL -o /tmp/Hopper.dmg "${URL}" 2>/dev/null; then
              break
            fi
            echo "Waiting for Hopper.dmg... ($i/30)"
            sleep 10
          done
          SHA=$(sha256sum /tmp/Hopper.dmg | cut -d' ' -f1)
          echo "sha_darwin_arm64=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew tap
        uses: actions/checkout@v5
        with:
          repository: wess/homebrew-packages
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update cask
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          mkdir -p tap/Casks
          cat > tap/Casks/hopper.rb << 'RUBY'
          cask "hopper" do
            version "VERSION_PLACEHOLDER"
            sha256 "SHA_DARWIN_ARM64_PLACEHOLDER"

            url "https://github.com/wess/hopper/releases/download/v#{version}/Hopper.dmg"
            name "Hopper"
            desc "Native Docker engine and manager — runs Docker in its own VM, no Docker Desktop"
            homepage "https://github.com/wess/hopper"

            depends_on arch: :arm64
            depends_on macos: :sonoma

            app "Hopper.app"

            zap trash: [
              "~/Library/Application Support/Hopper",
              "~/Library/Preferences/io.wess.hopper.plist",
              "~/.hopper",
            ]
          end
          RUBY
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" tap/Casks/hopper.rb
          sed -i "s/SHA_DARWIN_ARM64_PLACEHOLDER/${{ steps.shas.outputs.sha_darwin_arm64 }}/g" tap/Casks/hopper.rb

      - name: Push updated cask
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/hopper.rb
          if git diff --cached --quiet; then
            echo "Cask unchanged — skipping push."
          else
            git commit -m "Update hopper to v${{ needs.check-version.outputs.version }}"
            git push
          fi
