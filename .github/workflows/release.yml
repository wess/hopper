name: Release

on:
  push:
    branches: [main]
    paths:
      - "package.json"

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Check if version changed
        id: diff
        run: |
          OLD=$(git show HEAD~1:package.json | jq -r '.version' 2>/dev/null || echo "")
          NEW=$(jq -r '.version' package.json)
          if [ "$OLD" != "$NEW" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get version
        id: version
        run: echo "version=$(jq -r '.version' package.json)" >> "$GITHUB_OUTPUT"

  create-release:
    runs-on: ubuntu-latest
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Create git tag
        run: |
          git tag "v${{ needs.check-version.outputs.version }}"
          git push origin "v${{ needs.check-version.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.check-version.outputs.version }}"
          generate_release_notes: true
          draft: false

  build:
    needs: [check-version, create-release]
    if: needs.check-version.outputs.changed == 'true'
    runs-on: macos-latest
    # All three signing creds are wired through env so butter.yaml's
    # `{APPLE_*}` placeholders resolve at config-load time. When the
    # secrets aren't set (forks, PR previews), the resolved values are
    # empty strings and butter falls back to ad-hoc signing without
    # attempting notarization.
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: "v${{ needs.check-version.outputs.version }}"
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Import signing certificate
        if: env.APPLE_SIGNING_IDENTITY != ''
        env:
          CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Import the Developer ID Application cert into a temporary keychain
          # so `codesign` can find it. The keychain is wiped at job end.
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          rm -f "$RUNNER_TEMP/cert.p12"

      # butter compile embeds a prebuilt semhelper dylib, but butter only
      # builds it as a side effect of running the app — so build it here in the
      # installed package first, otherwise `butter compile` fails reading it.
      - name: Build butter native helper
        run: |
          find node_modules -path '*/butter/src/ipc/native/semhelper.c' -print0 \
            | while IFS= read -r -d '' src; do
                clang -shared -o "${src%.c}.dylib" "$src" -fPIC
                echo "built ${src%.c}.dylib"
              done

      - name: Compile
        run: bun run build

      - name: Bundle (.app)
        run: bun run bundle

      # Reads bundle.macos from butter.yaml. With creds in env, this signs
      # with Developer ID + hardened runtime + JIT entitlements and submits
      # for notarization. Without creds, falls back to an ad-hoc signature
      # so the .app launches locally (right-click → Open on first run).
      - name: Sign + notarize
        run: bun run sign

      - name: Package (.dmg)
        run: bun run package

      - name: Verify signature
        run: |
          codesign --verify --deep --strict --verbose=2 dist/Hopper.app
          spctl --assess --type execute --verbose dist/Hopper.app || \
            echo "spctl assessment failed (expected for ad-hoc / unnotarized builds)"

      - name: Upload DMG
        run: gh release upload "v${{ needs.check-version.outputs.version }}" dist/Hopper.dmg --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  update-homebrew:
    runs-on: ubuntu-latest
    needs: [check-version, build]
    if: needs.check-version.outputs.changed == 'true'
    steps:
      - name: Download DMG and compute SHA
        id: shas
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          URL="https://github.com/wess/hopper/releases/download/v${VERSION}/Hopper.dmg"
          for i in $(seq 1 30); do
            if curl -fsSL -o /tmp/Hopper.dmg "${URL}" 2>/dev/null; then
              break
            fi
            echo "Waiting for Hopper.dmg... ($i/30)"
            sleep 10
          done
          SHA=$(sha256sum /tmp/Hopper.dmg | cut -d' ' -f1)
          echo "sha_darwin_arm64=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew tap
        uses: actions/checkout@v5
        with:
          repository: wess/homebrew-packages
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update cask
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          mkdir -p tap/Casks
          cat > tap/Casks/hopper.rb << 'RUBY'
          cask "hopper" do
            version "VERSION_PLACEHOLDER"
            sha256 "SHA_DARWIN_ARM64_PLACEHOLDER"

            url "https://github.com/wess/hopper/releases/download/v#{version}/Hopper.dmg"
            name "Hopper"
            desc "Native desktop client for managing Docker"
            homepage "https://github.com/wess/hopper"

            depends_on arch: :arm64

            app "Hopper.app"

            zap trash: [
              "~/Library/Application Support/Hopper",
              "~/Library/Preferences/io.wess.hopper.plist",
            ]
          end
          RUBY
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" tap/Casks/hopper.rb
          sed -i "s/SHA_DARWIN_ARM64_PLACEHOLDER/${{ steps.shas.outputs.sha_darwin_arm64 }}/g" tap/Casks/hopper.rb

      - name: Push updated cask
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/hopper.rb
          if git diff --cached --quiet; then
            echo "Cask unchanged — skipping push."
          else
            git commit -m "Update hopper to v${{ needs.check-version.outputs.version }}"
            git push
          fi
