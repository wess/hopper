name: Release

on:
  push:
    branches: [main]
    paths:
      - "package.json"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      # Release when the package.json version has no matching tag yet. This is
      # idempotent and works for both push and manual workflow_dispatch (a
      # HEAD~1 diff would miss dispatches and re-released versions).
      - name: Decide whether to release
        id: diff
        run: |
          NEW=$(jq -r '.version' package.json)
          if git ls-remote --tags origin "refs/tags/v${NEW}" | grep -q .; then
            echo "v${NEW} already released — skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Get version
        id: version
        run: echo "version=$(jq -r '.version' package.json)" >> "$GITHUB_OUTPUT"

  create-release:
    runs-on: ubuntu-latest
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Create git tag
        run: |
          git tag "v${{ needs.check-version.outputs.version }}"
          git push origin "v${{ needs.check-version.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.check-version.outputs.version }}"
          generate_release_notes: true
          draft: false

  # Build the guest engine image (kernel + initramfs) that hopperd boots. A raw
  # arm64 kernel cross-compiled from native/guest/kernel.config, plus the rootfs
  # (Apache-2.0 Docker Engine) packed into an initramfs with GNU cpio.
  guest:
    runs-on: ubuntu-latest
    needs: [check-version, create-release]
    if: needs.check-version.outputs.changed == 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: "v${{ needs.check-version.outputs.version }}"

      - name: Cache guest kernel
        id: kcache
        uses: actions/cache@v4
        with:
          path: native/hopperd/.build/guest/vmlinuz
          key: hopper-kernel-6.12.8-${{ hashFiles('native/guest/kernel.config') }}

      - name: Install kernel build deps
        if: steps.kcache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu bc bison flex libssl-dev libelf-dev cpio xz-utils

      - name: Build aarch64 kernel
        if: steps.kcache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ver="6.12.8"
          series="v${ver%%.*}.x"
          curl -fsSL "https://cdn.kernel.org/pub/linux/kernel/${series}/linux-${ver}.tar.xz" | tar -xJ
          cd "linux-${ver}"
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          make defconfig
          ./scripts/kconfig/merge_config.sh -m .config "$GITHUB_WORKSPACE/native/guest/kernel.config"
          # Force the bridge stack built-in (IPV6=m would otherwise cap BRIDGE
          # at =m, and an initramfs-only guest has no modules).
          scripts/config -e IPV6 -e BRIDGE -e BRIDGE_NETFILTER -e LLC -e STP -e VLAN_8021Q
          make olddefconfig
          grep -q '^CONFIG_BRIDGE=y' .config || { echo 'FATAL: CONFIG_BRIDGE not built-in'; exit 1; }
          make -j"$(nproc)" Image
          mkdir -p "$GITHUB_WORKSPACE/native/hopperd/.build/guest"
          cp arch/arm64/boot/Image "$GITHUB_WORKSPACE/native/hopperd/.build/guest/vmlinuz"

      - name: Set up QEMU (cross-arch rootfs build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build guest rootfs -> initrd
        run: |
          set -euo pipefail
          out="native/hopperd/.build/guest"
          mkdir -p "$out"
          docker buildx build --load \
            --platform linux/arm64 \
            --build-arg "DOCKER_ARCH=aarch64" \
            -f native/guest/dockerfile \
            -t hopper-guest native/guest
          # Pack the initramfs inside a Linux container (GNU cpio).
          docker run --rm --platform linux/arm64 --entrypoint sh hopper-guest \
            -c 'cd / && find . -xdev | cpio -o -H newc 2>/dev/null | gzip -9' > "$out/initrd"
          ls -la "$out"

      - name: Upload guest assets
        uses: actions/upload-artifact@v4
        with:
          name: guest
          path: |
            native/hopperd/.build/guest/vmlinuz
            native/hopperd/.build/guest/initrd

  build:
    needs: [check-version, create-release, guest]
    if: needs.check-version.outputs.changed == 'true'
    runs-on: macos-latest
    # All signing creds are wired through env so butter.yaml's `{APPLE_*}`
    # placeholders resolve. Absent (forks), butter falls back to ad-hoc and
    # skips notarization — but then the embedded VM engine won't boot.
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: "v${{ needs.check-version.outputs.version }}"
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build hopperd (release)
        run: swift build -c release --package-path native/hopperd

      - name: Fetch Compose v2 (host binary)
        run: scripts/build/compose.sh

      - name: Download guest assets
        uses: actions/download-artifact@v4
        with:
          name: guest
          path: native/hopperd/.build/guest

      - name: Import signing certificate
        if: env.APPLE_SIGNING_IDENTITY != ''
        env:
          CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Import the Developer ID Application cert into a temporary keychain
          # so `codesign` can find it. The keychain is wiped at job end.
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          rm -f "$RUNNER_TEMP/cert.p12"

      # butter compile embeds a prebuilt semhelper dylib, but butter only
      # builds it as a side effect of running the app — so build it here in the
      # installed package first, otherwise `butter compile` fails reading it.
      - name: Build butter native helper
        run: |
          find node_modules -path '*/butter/src/ipc/native/semhelper.c' -print0 \
            | while IFS= read -r -d '' src; do
                clang -shared -o "${src%.c}.dylib" "$src" -fPIC
                echo "built ${src%.c}.dylib"
              done

      - name: Compile
        run: bun run build

      - name: Bundle (.app — embeds hopperd + compose in MacOS/sidecars)
        run: bun run bundle

      # The guest kernel + initrd are DATA: they go in Contents/Resources/, not
      # under MacOS/ (codesign rejects unsigned "code" there). Copy them in
      # before signing so the outer signature seals them as resources.
      - name: Stage guest assets into Resources
        run: |
          res="dist/Hopper.app/Contents/Resources"
          mkdir -p "$res"
          cp native/hopperd/.build/guest/vmlinuz native/hopperd/.build/guest/initrd "$res/"

      # Reads bundle.macos from butter.yaml. With creds, signs inside-out
      # (hopperd gets com.apple.security.virtualization) + hardened runtime +
      # JIT entitlements, then notarizes. Without creds, ad-hoc fallback.
      - name: Sign + notarize
        run: bun run sign

      - name: Package (.dmg)
        run: bun run package

      - name: Verify engine bundle
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 dist/Hopper.app
          app="dist/Hopper.app/Contents"
          helper="$app/MacOS/sidecars/hopperd"
          test -x "$helper" || { echo "FATAL: hopperd helper missing from the bundle"; exit 1; }
          test -f "$app/Resources/vmlinuz" || { echo "FATAL: guest kernel (vmlinuz) not in Resources"; exit 1; }
          test -f "$app/Resources/initrd" || { echo "FATAL: guest initrd not in Resources"; exit 1; }
          if file "$app/Resources/vmlinuz" | grep -qi gzip; then
            echo "FATAL: vmlinuz is gzip-compressed; VZ needs a raw arm64 Image"; exit 1
          fi
          if codesign -d --entitlements - "$helper" 2>/dev/null | grep -q virtualization; then
            echo "OK: hopperd carries com.apple.security.virtualization"
          else
            echo "FATAL: hopperd is missing the virtualization entitlement — the VM cannot start"
            exit 1
          fi
          if [ -z "${APPLE_SIGNING_IDENTITY}" ]; then
            echo "::warning::Ad-hoc build — the VM engine will not boot without a Developer ID."
          fi
          spctl --assess --type execute --verbose dist/Hopper.app || \
            echo "spctl assessment failed (expected for ad-hoc / unnotarized builds)"

      - name: Upload DMG
        run: gh release upload "v${{ needs.check-version.outputs.version }}" dist/Hopper.dmg --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  update-homebrew:
    runs-on: ubuntu-latest
    needs: [check-version, build]
    if: needs.check-version.outputs.changed == 'true'
    steps:
      - name: Download DMG and compute SHA
        id: shas
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          URL="https://github.com/wess/hopper/releases/download/v${VERSION}/Hopper.dmg"
          for i in $(seq 1 30); do
            if curl -fsSL -o /tmp/Hopper.dmg "${URL}" 2>/dev/null; then
              break
            fi
            echo "Waiting for Hopper.dmg... ($i/30)"
            sleep 10
          done
          SHA=$(sha256sum /tmp/Hopper.dmg | cut -d' ' -f1)
          echo "sha_darwin_arm64=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew tap
        uses: actions/checkout@v5
        with:
          repository: wess/homebrew-packages
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update cask
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          mkdir -p tap/Casks
          cat > tap/Casks/hopper.rb << 'RUBY'
          cask "hopper" do
            version "VERSION_PLACEHOLDER"
            sha256 "SHA_DARWIN_ARM64_PLACEHOLDER"

            url "https://github.com/wess/hopper/releases/download/v#{version}/Hopper.dmg"
            name "Hopper"
            desc "Native Docker engine and manager — runs Docker in its own VM, no Docker Desktop"
            homepage "https://github.com/wess/hopper"

            depends_on arch: :arm64
            depends_on macos: ">= :sonoma"

            app "Hopper.app"

            zap trash: [
              "~/Library/Application Support/Hopper",
              "~/Library/Preferences/io.wess.hopper.plist",
              "~/.hopper",
            ]
          end
          RUBY
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" tap/Casks/hopper.rb
          sed -i "s/SHA_DARWIN_ARM64_PLACEHOLDER/${{ steps.shas.outputs.sha_darwin_arm64 }}/g" tap/Casks/hopper.rb

      - name: Push updated cask
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/hopper.rb
          if git diff --cached --quiet; then
            echo "Cask unchanged — skipping push."
          else
            git commit -m "Update hopper to v${{ needs.check-version.outputs.version }}"
            git push
          fi
