name: Engine Build

# Produces a Docker-Desktop-free, notarized Hopper in one run:
#   guest  (ubuntu) — cross-compile an arm64 kernel + build the rootfs initrd
#   build  (macos)  — build hopperd, fetch Compose, embed the guest assets,
#                     then compile → bundle → inside-out sign → notarize → dmg
# Trigger with: gh workflow run engine.yml
on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Linux kernel version (LTS) for the guest"
        default: "6.12.8"
      docker_version:
        description: "Static Docker Engine version inside the guest"
        default: "27.5.1"
      compose_version:
        description: "Docker Compose v2 version (host binary)"
        default: "v2.32.4"

permissions:
  contents: read

jobs:
  guest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache guest kernel
        id: kcache
        uses: actions/cache@v4
        with:
          path: native/hopperd/.build/guest/vmlinuz
          key: hopper-kernel-${{ inputs.kernel_version }}-${{ hashFiles('native/guest/kernel.config') }}

      - name: Install kernel build deps
        if: steps.kcache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu bc bison flex libssl-dev libelf-dev cpio xz-utils

      - name: Build aarch64 kernel
        if: steps.kcache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ver="${{ inputs.kernel_version }}"
          series="v${ver%%.*}.x"
          curl -fsSL "https://cdn.kernel.org/pub/linux/kernel/${series}/linux-${ver}.tar.xz" | tar -xJ
          cd "linux-${ver}"
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          make defconfig
          ./scripts/kconfig/merge_config.sh -m .config "$GITHUB_WORKSPACE/native/guest/kernel.config"
          # Force the bridge stack built-in (IPV6=m would otherwise cap BRIDGE
          # at =m, and an initramfs-only guest has no modules).
          scripts/config -e IPV6 -e BRIDGE -e BRIDGE_NETFILTER -e LLC -e STP -e VLAN_8021Q
          make olddefconfig
          grep -q '^CONFIG_BRIDGE=y' .config || { echo 'FATAL: CONFIG_BRIDGE not built-in'; exit 1; }
          make -j"$(nproc)" Image
          mkdir -p "$GITHUB_WORKSPACE/native/hopperd/.build/guest"
          cp arch/arm64/boot/Image "$GITHUB_WORKSPACE/native/hopperd/.build/guest/vmlinuz"

      - name: Set up QEMU (cross-arch rootfs build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build guest rootfs -> initrd
        run: |
          set -euo pipefail
          out="native/hopperd/.build/guest"
          mkdir -p "$out"
          docker buildx build --load \
            --platform linux/arm64 \
            --build-arg "DOCKER_VERSION=${{ inputs.docker_version }}" \
            --build-arg "DOCKER_ARCH=aarch64" \
            -f native/guest/dockerfile \
            -t hopper-guest native/guest
          cid="$(docker create hopper-guest)"
          tmp="$(mktemp -d)"
          docker export "$cid" | tar -x -C "$tmp"
          docker rm "$cid"
          ( cd "$tmp" && find . | cpio -o -H newc | gzip -9 ) > "$out/initrd"
          ls -la "$out"

      - name: Upload guest assets
        uses: actions/upload-artifact@v4
        with:
          name: guest
          path: |
            native/hopperd/.build/guest/vmlinuz
            native/hopperd/.build/guest/initrd

  build:
    needs: guest
    runs-on: macos-latest
    # Signing creds flow through env so butter.yaml's {APPLE_*} placeholders
    # resolve; absent (forks), butter falls back to ad-hoc + no notarization.
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build hopperd (release)
        run: swift build -c release --package-path native/hopperd

      - name: Fetch Compose v2 (host binary)
        env:
          COMPOSE_VERSION: ${{ inputs.compose_version }}
        run: scripts/build/compose.sh

      - name: Download guest assets
        uses: actions/download-artifact@v4
        with:
          name: guest
          path: native/hopperd/.build/guest

      - name: Import signing certificate
        if: env.APPLE_SIGNING_IDENTITY != ''
        env:
          CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          rm -f "$RUNNER_TEMP/cert.p12"

      # butter compile embeds a prebuilt semhelper dylib; build it first.
      - name: Build butter native helper
        run: |
          find node_modules -path '*/butter/src/ipc/native/semhelper.c' -print0 \
            | while IFS= read -r -d '' src; do
                clang -shared -o "${src%.c}.dylib" "$src" -fPIC
                echo "built ${src%.c}.dylib"
              done

      - name: Compile
        run: bun run build

      - name: Bundle (.app — embeds hopperd + compose in MacOS/sidecars)
        run: bun run bundle

      # Guest kernel + initrd are DATA → Contents/Resources/ (codesign rejects
      # unsigned "code" under MacOS/). Copy before signing so they're sealed.
      - name: Stage guest assets into Resources
        run: |
          res="dist/Hopper.app/Contents/Resources"
          mkdir -p "$res"
          cp native/hopperd/.build/guest/vmlinuz native/hopperd/.build/guest/initrd "$res/"

      # Inside-out signing: hopperd gets com.apple.security.virtualization from
      # butter.yaml's sidecarEntitlements.
      - name: Sign + notarize
        run: bun run sign

      - name: Package (.dmg)
        run: bun run package

      # Fail the build if it can't possibly boot the engine, rather than
      # shipping a dead DMG. (A missing entitlement / missing guest assets are
      # hard errors; an ad-hoc signature is a loud warning since the entitlement
      # is present but not *effective* without a Developer ID.)
      - name: Verify engine bundle
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 dist/Hopper.app
          app="dist/Hopper.app/Contents"
          helper="$app/MacOS/sidecars/hopperd"

          test -x "$helper" || { echo "FATAL: hopperd helper missing from the bundle"; exit 1; }
          test -f "$app/Resources/vmlinuz" || { echo "FATAL: guest kernel (vmlinuz) not in Resources"; exit 1; }
          test -f "$app/Resources/initrd" || { echo "FATAL: guest initrd not in Resources"; exit 1; }

          # VZLinuxBootLoader needs a raw Image, not a gzipped vmlinuz.
          if file "$app/Resources/vmlinuz" | grep -qi gzip; then
            echo "FATAL: vmlinuz is gzip-compressed; VZ needs a raw arm64 Image"; exit 1
          fi

          if codesign -d --entitlements - "$helper" 2>/dev/null | grep -q virtualization; then
            echo "OK: hopperd carries com.apple.security.virtualization"
          else
            echo "FATAL: hopperd is missing the virtualization entitlement — the VM cannot start"
            exit 1
          fi

          if [ -z "${APPLE_SIGNING_IDENTITY}" ] || codesign -dvvv "$helper" 2>&1 | grep -qi 'Signature=adhoc'; then
            echo "::warning::Ad-hoc signed build. The virtualization entitlement is present but NOT effective without a Developer ID — the VM engine will refuse to start. Set the APPLE_* repo secrets (APPLE_SIGNING_IDENTITY, APPLE_CERT_P12, APPLE_CERT_PASSWORD, KEYCHAIN_PASSWORD, APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD) for a bootable, notarized build."
          fi

          spctl --assess --type execute --verbose dist/Hopper.app || \
            echo "spctl assessment failed (expected for ad-hoc / unnotarized builds)"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: hopper-engine-dmg
          path: dist/Hopper.dmg
