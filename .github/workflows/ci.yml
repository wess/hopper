name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: macOS Apple silicon
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Test workspace
        # Every crate runs even after one fails, so a platform-specific break
        # reports all of its failures in one run instead of one crate at a time.
        run: cargo test --workspace --locked --no-fail-fast

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Release build workspace
        run: cargo build --workspace --release --locked
